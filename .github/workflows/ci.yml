# Copyright (c) 2026, Anne Skydancer (neo-j2k)
#
# Build and test on every pull request and on main: Windows (MSVC, clang-cl, MSVC and clang-cl with
# AddressSanitizer), Linux (GCC 15, Clang, the scalar build, Clang with AddressSanitizer and
# UndefinedBehaviorSanitizer, Clang with ThreadSanitizer over the threaded tests and the threaded
# fuzz replay) and Ubuntu 24.04 (GCC 14). Every job runs the oracle against its
# reference tables, so the oracle's output is checked to be the same on every compiler and
# platform. The lint job checks the workflows, the generated compatibility header, the licence
# headers and the vendored oracle against its pinned commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      replace_standalone:
        description: Replace the existing version's Windows standalone release download after CI succeeds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OPENJPEG_DATA_COMMIT: 39524bd3a601d90ed8e0177559400d23945f96a9

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Compatibility header is current and complete
        run: python3 -I tools/gen_compat.py --check
      - name: openjp2 module's forwarders are current and match openjpeg.h
        run: python3 -I tools/gen_openjp2.py --check
      - name: Licence headers
        run: python3 -I tools/check_headers.py
      - name: Check scripts
        run: |
          python3 -I tools/check_exports.py --selftest
          python3 -I tools/check_objects.py --selftest
          python3 -I tools/check_openjp2.py --selftest
      - name: Vendored oracle equals its pinned commit plus patches
        run: python3 -I tools/oracle_sync.py --verify

  windows:
    name: windows (${{ matrix.preset }})
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-msvc, windows-clang-cl, windows-msvc-asan, windows-clang-cl-asan]
    env:
      NJ2K_TESTDATA: ${{ github.workspace }}/.testdata/openjpeg-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Conformance data (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .testdata/openjpeg-data
          key: openjpeg-data-conformance-${{ env.OPENJPEG_DATA_COMMIT }}-windows
      - name: Conformance data (fetch)
        shell: bash
        run: python -I tools/fetch_testdata.py
      # windows-msvc-asan, windows-clang-cl-asan: the build puts the AddressSanitizer runtime beside
      # every program (cmake/NJ2KFlags.cmake), so nothing here adds it to PATH and the tests prove the
      # copies; the clang-cl one also proves the runtime libraries its link names
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Build and verify standalone release archive
        if: matrix.preset == 'windows-msvc'
        shell: pwsh
        run: |
          cmake --preset windows-msvc -B build/standalone -DNJ2K_BUILD_STATIC=ON -DNJ2K_BUILD_SHARED=OFF -DNJ2K_MODULE_OPENJP2=ON -DNJ2K_MSVC_STATIC_RUNTIME=ON -DNJ2K_BUILD_TESTS=OFF -DNJ2K_BUILD_TOOLS=OFF -DNJ2K_BUILD_BENCH=OFF -DNJ2K_BUILD_FUZZERS=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/standalone --config Release --target neoj2k_openjp2 --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -I tools/package_openjp2.py --library build/standalone/modules/openjp2/Release/openjp2.dll --out dist --platform win-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git rev-parse HEAD | Set-Content dist/SOURCE_REVISION.txt
      - name: Save CI-built standalone
        if: matrix.preset == 'windows-msvc'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-win-x64
          path: dist/
          if-no-files-found: error

  replace-standalone:
    name: Replace standalone release download
    if: github.event_name == 'workflow_dispatch' && inputs.replace_standalone
    needs: [lint, windows, linux, linux-lts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch and publish verified CI artifact
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name standalone-win-x64 --dir standalone
          python3 -I tools/publish_standalone.py standalone

  linux:
    name: linux (${{ matrix.preset }}, ${{ matrix.cc }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc, cc: gcc-15, cxx: g++-15, packages: g++-15 }
          - { preset: linux-gcc-scalar, cc: gcc-15, cxx: g++-15, packages: g++-15 }
          # link-time optimisation with -Werror=odr: a type defined differently in two translation
          # units (the decoder's and the encoder's tag trees did) fails the build
          - { preset: linux-gcc-lto-odr, cc: gcc-15, cxx: g++-15, packages: g++-15 }
          - { preset: linux-clang, cc: clang, cxx: clang++, packages: clang lld }
          - { preset: linux-clang-asan-ubsan, cc: clang, cxx: clang++, packages: clang lld }
          # stage 5: the test preset runs the tests named threads (decode_threads: one thread against
          # 2-16 parts of a shared pool; fuzz_replay.decode_threads: the decode target's seeds and
          # regressions through a pool) under ThreadSanitizer
          - { preset: linux-clang-tsan, cc: clang, cxx: clang++, packages: clang lld }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      NJ2K_TESTDATA: ${{ github.workspace }}/.testdata/openjpeg-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ninja-build ${{ matrix.packages }}
          if [ "$CC" = clang ]; then
            v="$(clang -dumpversion | cut -d. -f1)"
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq "libclang-rt-${v}-dev" || true
          fi
          "$CC" --version | head -n 1
          cmake --version | head -n 1
      - name: Conformance data (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .testdata/openjpeg-data
          key: openjpeg-data-conformance-${{ env.OPENJPEG_DATA_COMMIT }}-linux
      - name: Conformance data (fetch)
        run: python3 -I tools/fetch_testdata.py
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 4

  linux-lts:
    name: linux-lts (ubuntu:24.04, gcc-14)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    container:
      image: ubuntu:24.04
      options: --dns 168.63.129.16 --dns 8.8.8.8 --dns 1.1.1.1
    env:
      CC: gcc-14
      CXX: g++-14
      NJ2K_TESTDATA: ${{ github.workspace }}/.testdata/openjpeg-data
    steps:
      - name: Toolchain
        run: |
          set -eu
          # archive.ubuntu.com:80 has been timing out from the runners' containers (connect timeouts
          # after the name resolved): use the runners' in-Azure mirror, bound each fetch, retry, and
          # retry the whole step once after a pause.
          sed -i 's#http://archive.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g; s#http://security.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g'             /etc/apt/sources.list.d/ubuntu.sources
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for attempt in 1 2; do
            if apt-get $apt_opts update -qq                 && DEBIAN_FRONTEND=noninteractive apt-get $apt_opts install -y -qq g++-14 cmake ninja-build python3 git ca-certificates binutils; then
              break
            fi
            if [ "$attempt" = 2 ]; then echo "::error::apt failed twice"; exit 1; fi
            echo "apt failed (attempt $attempt of 2); retrying in 30 s"; sleep 30
          done
          gcc-14 --version | head -n 1
          cmake --version | head -n 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Conformance data (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .testdata/openjpeg-data
          key: openjpeg-data-conformance-${{ env.OPENJPEG_DATA_COMMIT }}-linux
      - name: Conformance data (fetch)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.testdata/openjpeg-data"
          python3 -I tools/fetch_testdata.py
      - name: Configure
        run: cmake --preset linux-gcc
      - name: Build
        run: cmake --build --preset linux-gcc --parallel
      - name: Test
        run: ctest --preset linux-gcc --parallel 4
