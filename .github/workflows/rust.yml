#
# The Rust twin (rust/README.md), beside the C++ jobs of ci.yml, which it leaves unchanged. It runs
# when the twin changes and when the C++ it is compared with changes (a C++ change moves the
# oracle):
# - lint: fmt, clippy at both CPU levels, docs, cargo-deny, and the native-Rust check (neo-j2k's
#   dependency tree holds no C or C++, its package no C or C++ source, its sources no FFI);
# - windows (MSVC), linux (GCC 15) and linux-lts (Ubuntu 24.04, GCC 14): every test at baseline
#   x86-64 and at x86-64-v3 against the C++ oracle; windows and linux build the oracle with CMake
#   first (NJ2K_ORACLE_DIR), linux-lts lets the oracle crate's build.rs build it;
# - miri: the crates' own unit tests and the AVX2 kernels under Miri (rust/nightly-toolchain);
# - scheduled and manual reference replay: the larger committed cut table through the Rust codec alone;
# - fuzz: seeded decoder, encoder and C++ differential tests under AddressSanitizer,
#   with longer runs on the nightly schedule and manual dispatch.
name: Rust

on:
  pull_request:
    paths:
      - "rust/**"
      - "src/**"
      - "include/**"
      - "oracle/**"
      - "tests/common/**"
      - "corpus/**"
      - "fuzz/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "tools/check_rust_native.py"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "src/**"
      - "include/**"
      - "oracle/**"
      - "tests/common/**"
      - "corpus/**"
      - "fuzz/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "tools/check_rust_native.py"
      - ".github/workflows/rust.yml"
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OPENJPEG_DATA_COMMIT: 39524bd3a601d90ed8e0177559400d23945f96a9
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # the oracle's C++ build: the static library, the oracle, the harness and the shim only
  ORACLE_OPTIONS: >-
    -DNJ2K_BUILD_RUST_SHIM=ON -DNJ2K_BUILD_TESTS=OFF -DNJ2K_BUILD_TOOLS=OFF -DNJ2K_BUILD_BENCH=OFF
    -DNJ2K_BUILD_SHARED=OFF -DNJ2K_INSTALL=OFF

jobs:
  lint:
    if: github.event_name != 'schedule'
    name: rust-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # nothing here links: no C++ build
      NJ2K_ORACLE_NO_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: |
          set -euo pipefail
          rustup toolchain install || rustup show
          rustc --version
      - name: Format
        working-directory: rust
        run: cargo fmt --all --check
      - name: Clippy (baseline x86-64)
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy (x86-64-v3)
        working-directory: rust
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: target-v3
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy (decoder-only)
        working-directory: rust
        run: cargo clippy -p neo-j2k --all-targets --no-default-features --features std --locked -- -D warnings
      - name: Docs
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked
      - name: The crate is native Rust
        run: |
          python3 -I tools/check_rust_native.py --selftest
          python3 -I tools/check_rust_native.py
      - name: Build the crate from its package
        working-directory: rust
        run: cargo package --offline --locked -p neo-j2k
      - name: cargo-deny (licences, advisories, bans, sources)
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          name="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          archive="$RUNNER_TEMP/$name.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 -o "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/$name.tar.gz"
          echo "$DENY_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cd rust
          "$RUNNER_TEMP/$name/cargo-deny" --workspace check licenses bans sources advisories

  windows:
    if: github.event_name != 'schedule'
    name: rust-windows (MSVC)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      NJ2K_TESTDATA: ${{ github.workspace }}/.testdata/openjpeg-data
      NJ2K_ORACLE_DIR: ${{ github.workspace }}/build/windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Conformance data (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .testdata/openjpeg-data
          key: openjpeg-data-conformance-${{ env.OPENJPEG_DATA_COMMIT }}-windows
      - name: Conformance data (fetch)
        run: python -I tools/fetch_testdata.py
      - name: Toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: |
          set -euo pipefail
          rustup toolchain install || rustup show
          rustc --version
      - name: The C++ oracle
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          cmake --preset windows-msvc $ORACLE_OPTIONS
          cmake --build --preset windows-msvc --target nj2k_rust_shim --parallel
      - name: Test (baseline x86-64)
        working-directory: rust
        run: |
          set -euo pipefail
          export NJ2K_TEST_TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP"
          cargo test --release --workspace --locked
          cargo test --release --manifest-path fuzz/Cargo.toml --features oracle --locked --lib
      - name: Test (x86-64-v3)
        working-directory: rust
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: target-v3
        run: |
          set -euo pipefail
          export NJ2K_TEST_TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP"
          cargo test --release --workspace --locked
          cargo test --release --manifest-path fuzz/Cargo.toml --features oracle --locked --lib

  linux:
    if: github.event_name != 'schedule'
    name: rust-linux (GCC 15)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CC: gcc-15
      CXX: g++-15
      NJ2K_TESTDATA: ${{ github.workspace }}/.testdata/openjpeg-data
      NJ2K_ORACLE_DIR: ${{ github.workspace }}/build/linux-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: C++ toolchain
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ninja-build g++-15
          "$CXX" --version | head -n 1
      - name: Conformance and non-regression data (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .testdata/openjpeg-data
          key: openjpeg-data-full-${{ env.OPENJPEG_DATA_COMMIT }}-linux
      - name: Conformance and non-regression data (fetch)
        run: python3 -I tools/fetch_testdata.py --all
      - name: Toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: |
          set -euo pipefail
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -fsSL --retry 5 https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install || rustup show
          rustc --version
      - name: The C++ oracle
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          cmake --preset linux-gcc $ORACLE_OPTIONS
          cmake --build --preset linux-gcc --target nj2k_rust_shim --parallel
      - name: Test (baseline x86-64)
        working-directory: rust
        run: |
          set -euo pipefail
          export NJ2K_TEST_TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          cargo test --release --workspace --locked
          cargo test --release --locked -p neo-j2k --lib -- --ignored --exact mct::tests::irreversible_shift_matches_cpp_for_all_float_bits
      - name: Test (x86-64-v3)
        working-directory: rust
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: target-v3
        run: |
          set -euo pipefail
          export NJ2K_TEST_TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          cargo test --release --workspace --locked
          cargo test --release --locked -p neo-j2k --lib -- --ignored --exact mct::tests::irreversible_shift_matches_cpp_for_all_float_bits

  linux-lts:
    if: github.event_name != 'schedule'
    name: rust-linux-lts (ubuntu:24.04, GCC 14)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    container:
      image: ubuntu:24.04
      options: --dns 168.63.129.16 --dns 8.8.8.8 --dns 1.1.1.1
    env:
      CC: gcc-14
      CXX: g++-14
      # link with the GCC the oracle is built with: its driver finds its own libstdc++ (the
      # container's cc is another GCC, whose search path does not hold GCC 14's)
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc-14
      # the oracle crate's build.rs builds the C++ itself here (no NJ2K_ORACLE_DIR)
      NJ2K_ORACLE_PRESET: linux-gcc
      # the container runs as root, whose home is /root, while the runner sets HOME to
      # /github/home: rustup reports that mismatch, so HOME is root's and rustup has its own homes
      HOME: /root
      RUSTUP_HOME: /opt/rustup
      CARGO_HOME: /opt/cargo
    steps:
      - name: Toolchain
        run: |
          set -eu
          # as ci.yml's linux-lts job: the runners' in-Azure mirror, bounded fetches, one retry
          sed -i 's#http://archive.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g; s#http://security.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for attempt in 1 2; do
            if apt-get $apt_opts update -qq && DEBIAN_FRONTEND=noninteractive apt-get $apt_opts install -y -qq g++-14 cmake ninja-build python3 git ca-certificates curl; then
              break
            fi
            if [ "$attempt" = 2 ]; then echo "::error::apt failed twice"; exit 1; fi
            echo "apt failed (attempt $attempt of 2); retrying in 30 s"; sleep 30
          done
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          gcc-14 --version | head -n 1
          cmake --version | head -n 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (rust/rust-toolchain.toml)
        working-directory: rust
        run: |
          rustup toolchain install || rustup show
          rustc --version
      - name: Test (baseline x86-64)
        working-directory: rust
        run: |
          export NJ2K_TEST_TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          cargo test --release --workspace --locked
      - name: Test (x86-64-v3)
        working-directory: rust
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: target-v3
        run: |
          export NJ2K_TEST_TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          cargo test --release --workspace --locked

  miri:
    if: github.event_name != 'schedule'
    name: rust-miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NJ2K_ORACLE_NO_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly (rust/nightly-toolchain)
        working-directory: rust
        run: |
          set -euo pipefail
          nightly="$(tr -d '[:space:]' < nightly-toolchain)"
          echo "NIGHTLY=$nightly" >> "$GITHUB_ENV"
          rustup toolchain install "$nightly" --profile minimal --component miri,rust-src
          cargo "+$nightly" miri setup
      - name: Miri (scalar)
        working-directory: rust
        run: |
          cargo "+$NIGHTLY" miri test -p neo-j2k-testkit -p neo-j2k --lib --locked
          cargo "+$NIGHTLY" miri test -p neo-j2k --test miri_decode --locked
      - name: Miri (AVX2)
        working-directory: rust
        env:
          RUSTFLAGS: -C target-feature=+avx2
          CARGO_TARGET_DIR: target-miri-avx2
        run: |
          cargo "+$NIGHTLY" miri test -p neo-j2k --lib --locked -- avx2_ interleaved_targets_match_plane_writes_at_every_channel_count

  nightly-reference:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: rust-nightly-reference
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      NJ2K_ORACLE_NO_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Replay the extended cut table
        working-directory: rust
        run: cargo test --release --locked -p neo-j2k --test reference_replay -- --ignored --exact nightly_reference_cuts

  nightly-generated:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: rust-nightly-generated
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      CC: gcc-15
      CXX: g++-15
      NJ2K_ORACLE_DIR: ${{ github.workspace }}/build/linux-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build the C++ oracle
        run: |
          set -euo pipefail
          cmake --preset linux-gcc $ORACLE_OPTIONS
          cmake --build --preset linux-gcc --target nj2k_rust_shim --parallel
      - name: Compare generated coding combinations
        working-directory: rust
        run: cargo test --release --locked -p neo-j2k --test generated_matrix -- --ignored --exact extended_generated_coding_matrix_matches_openjpeg

  fuzz:
    name: rust-fuzz (${{ matrix.cpu }})
    runs-on: windows-2025
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        cpu: [x86-64, x86-64-v3]
    env:
      NJ2K_ORACLE_DIR: ${{ github.workspace }}/build/windows-msvc-asan
      FUZZ_SECONDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '600' || '90' }}
      API_SEQUENCE_SECONDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '600' || '45' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly and cargo-fuzz
        working-directory: rust
        shell: pwsh
        run: |
          $nightly = (Get-Content nightly-toolchain -Raw).Trim()
          rustup toolchain install $nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Build the sanitized C++ oracle
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          cmake --preset windows-msvc-asan $ORACLE_OPTIONS
          cmake --build --preset windows-msvc-asan --target nj2k_rust_shim --parallel
      - name: Fuzz the decoder and encoder
        working-directory: rust
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer'
          $vs = & (Join-Path $installer vswhere.exe) -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $nightly = (Get-Content nightly-toolchain -Raw).Trim()
          New-Item -ItemType Directory -Force fuzz/corpus/header_decode, fuzz/corpus/differential, fuzz/corpus/roundtrip, fuzz/corpus/encode_options, fuzz/corpus/api_sequence | Out-Null
          cargo "+$nightly" fuzz run header_decode fuzz/corpus/header_decode ../corpus/generated fuzz/seeds/jp2 -- -max_len=1048576 "-max_total_time=$env:FUZZ_SECONDS" -timeout=10 -print_final_stats=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo "+$nightly" fuzz run --features oracle differential fuzz/corpus/differential ../corpus/generated fuzz/seeds/jp2 -- -max_len=131072 "-max_total_time=$env:FUZZ_SECONDS" -timeout=10 -print_final_stats=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo "+$nightly" fuzz run --features oracle roundtrip fuzz/corpus/roundtrip ../fuzz/seeds/roundtrip -- -max_len=16400 "-max_total_time=$env:FUZZ_SECONDS" -timeout=10 -print_final_stats=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo "+$nightly" fuzz run --features oracle encode_options fuzz/corpus/encode_options ../fuzz/seeds/encode -- -max_len=16400 "-max_total_time=$env:FUZZ_SECONDS" -timeout=10 -print_final_stats=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo "+$nightly" fuzz run --features oracle api_sequence fuzz/corpus/api_sequence fuzz/seeds/api_sequence -- -max_len=18 "-max_total_time=$env:API_SEQUENCE_SECONDS" -timeout=10 -seed=137 -print_final_stats=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the fuzz lockfile
        run: git diff --exit-code -- rust/fuzz/Cargo.lock
