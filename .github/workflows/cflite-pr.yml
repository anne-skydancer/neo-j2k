#
# Short fuzzing of every pull request that touches code (ClusterFuzzLite, libFuzzer): the header,
# decode and lossless round-trip targets with AddressSanitizer and with UndefinedBehaviorSanitizer,
# five minutes each sanitizer. Long campaigns run locally or in the nightly workflow while the
# repository is private.
name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'oracle/**'
      - 'fuzz/**'
      - 'tests/common/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cflite-${{ matrix.sanitizer }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: c++
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: false
